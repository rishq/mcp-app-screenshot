[project]
name = "mcp-app-screenshot"
version = "0.2.0"
description = "Windows MCP server for secure application, screen, and IDE screenshots."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "mcp[cli]>=1.2.0,<2",
    "mss>=9.0.1",
    "pillow>=10.0.0",
    "psutil>=5.9.0",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.scripts]
mcp-app-screenshot = "server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["server.py"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F"]
