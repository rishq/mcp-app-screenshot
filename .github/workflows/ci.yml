name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Set up Python
        run: uv python install 3.11
      - name: Run tests
        run: uv run --python 3.11 --with pytest pytest
      - name: Lint
        run: uv run --python 3.11 --with ruff ruff check .
